<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Mortgage Calc</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c2330;--bd:#2a3240;--tx:#e6edf3;--mu:#8b949e;--ac:#f28c28;--ac2:#4c8dff;--ok:#3fb950;--bad:#f85149;--warn:#d29922}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
header .ttl{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ttl span{color:var(--ac);font-size:14px;margin-left:6px}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button:active{filter:brightness(1.3)}
button.pri{background:var(--ac);border-color:var(--ac);color:#111;font-weight:600}
main{padding:10px 10px 90px}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;overflow-x:auto;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;border:0;border-radius:0;background:none;color:var(--mu);padding:13px 7px;font-size:12.5px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.hero{background:linear-gradient(160deg,#1d2a44,#161b22)}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.lbl{color:var(--mu);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--bd)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
h3{margin:2px 0 8px;font-size:14px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.fld{padding:8px 0;border-bottom:1px solid var(--bd)}
.fld:last-child{border-bottom:0}
.frow{display:flex;align-items:center;gap:8px}
.frow label{flex:1;min-width:0;color:var(--tx);font-size:14px}
.inbox{display:flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:0 8px;width:46%;max-width:170px}
.inbox:focus-within{border-color:var(--ac)}
.inbox .pre,.inbox .unit{color:var(--mu);font-size:14px}
input.num{flex:1;min-width:0;width:100%;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;padding:8px 4px;text-align:right;outline:none}
select{font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:8px;max-width:60%}
.rng{position:relative;touch-action:pan-y;padding:2px 0}
.rng input[type=range]{pointer-events:none;-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:32px;margin:4px 0 0;display:block;--p:0%}
.rng input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--ac) var(--p),var(--bd) var(--p))}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--ac);margin-top:-11px;border:4px solid var(--card);box-shadow:0 0 0 1px var(--ac);transition:transform .1s}
.rng.drag input[type=range]::-webkit-slider-thumb{transform:scale(1.25)}
.rng input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--ac);border:3px solid var(--card)}
.relink{display:none;padding:2px 8px;font-size:13px;color:var(--ac2);border-color:transparent;background:none}
.relink.show{display:inline-block}
.seg{display:flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 14px;background:var(--bg);color:var(--mu)}
.seg button.on{background:var(--ac);color:#111;font-weight:600}
.hint{color:var(--mu);font-size:12px;margin-top:2px;text-align:right}
.tog{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)}
.tog input{width:22px;height:22px;accent-color:var(--ac)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
.badge.ok{background:#12351d}.badge.bad{background:#3d1416}
.warn{background:#2e2410;border:1px solid #5c4813;color:#f0c45c;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px;white-space:pre-line}
.note{color:var(--mu);font-size:12px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .card{padding:10px;margin:0}
.grid2 .inbox{width:100%;max-width:none}
.grid2 .frow{flex-wrap:wrap}
.grid2 .frow label{flex:1 1 60%;font-size:13px;color:var(--mu)}
.grid2 select{max-width:100%;width:100%;font-size:13px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.diff div{background:var(--bg);border-radius:10px;padding:8px}
.diff b{display:block;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:600}
.item{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.item input.nm{flex:1;min-width:0;background:none;border:0;color:var(--tx);font:inherit;font-size:14px;outline:none}
.item .inbox{width:40%}
.item .x{padding:4px 10px;color:var(--bad);background:none;border-color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet.hidden{display:none}
.sheet .panel{background:var(--card);width:100%;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.sheet .phead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet .phead b{font-size:18px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.srow span{flex:1}
.srow input.sn{width:90px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;color:var(--tx);font:inherit;font-size:16px;padding:6px;text-align:right}
.save{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.save div{flex:1;min-width:0}
.save small{color:var(--mu)}
.txt{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font:inherit;font-size:16px;padding:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="ttl"><b>Mortgage Calc</b><span id="scnName"></span></div>
  <button id="btnPdf">PDF</button>
  <button id="btnSaves">Saves</button>
  <button id="btnSet" aria-label="Settings">&#9881;</button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="sheet" class="sheet hidden"><div class="panel" id="panel"></div></div>

<script>
'use strict';
/* ---------- storage ---------- */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- settings ---------- */
const DEF_CLOSING=[['Legal / notary',1500],['Home inspection',500],['Appraisal',400],['Title insurance',250],['Tax / strata adjustments',0],['Moving',0]];
const DEF_SET={buffer:2,floor:5.25,ovOn:false,ovRate:7.5,insGDS:39,insTDS:44,convGDS:44,convTDS:44,heat:100,strataPct:50,
  rentMethod:'add',rentAdd:80,rentOff:50,prem85:2.8,prem90:3.1,prem95:4.0,surcharge:0.2,compound:'semi',closing:DEF_CLOSING};
let SET=Object.assign({},DEF_SET,LS.get('mmc.set',{}));

/* ---------- scenario ---------- */
const DEF_S=()=>({name:'',price:800000,downMode:'pct',downPct:20,downAmt:160000,rate:4.29,amort:25,term:5,freq:'monthly',
  income:150000,debts:0,ptax:3000,heat:100,strata:0,rent:0,
  fthb:false,newBuild:false,gstOn:true,gstAmt:0,gstRebate:0,closing:SET.closing.map(([n,a])=>({n,a})),
  reqLoan:0,gdsLim:0,tdsLim:0,
  cA_loan:0,cA_rate:0,cA_amort:0,cA_term:0,cA_freq:'monthly',cB_loan:0,cB_rate:0,cB_amort:0,cB_term:0,cB_freq:'monthly',
  rValue:0,rBal:500000,rCurRate:5.29,rMonths:36,rRemAmort:20,rCurPmt:0,rPen:'greater',rComp:3.79,rPenMan:0,
  rRate:0,rAmort:0,rLTV:80,rNew:0,rDebts:0,rDebtPmt:0,rRoll:true,rFees:0,
  own:{},sched:false,tab:'pay'});
let S=Object.assign(DEF_S(),LS.get('mmc.cur',{}));
if(!S.own)S.own={};

/* linked fields: follow these until edited by hand */
const DEFS={
  heat:()=>SET.heat,
  gdsLim:()=>deal().insured?SET.insGDS:SET.convGDS,
  tdsLim:()=>deal().insured?SET.insTDS:SET.convTDS,
  reqLoan:()=>deal().loan,
  cA_loan:()=>deal().loan,cA_rate:()=>S.rate,cA_amort:()=>S.amort,cA_term:()=>S.term,cA_freq:()=>S.freq,
  cB_loan:()=>v('cA_loan'),cB_rate:()=>v('cA_rate'),cB_amort:()=>v('cA_amort'),cB_term:()=>v('cA_term'),cB_freq:()=>v('cA_freq'),
  rValue:()=>S.price,rRate:()=>S.rate,rAmort:()=>S.amort,
  rNew:()=>Math.max(0,v('rValue')*v('rLTV')/100),
  rCurPmt:()=>pmt(v('rBal'),v('rCurRate'),v('rRemAmort'),12),
  gstAmt:()=>S.price*0.05
};
function v(k){return (DEFS[k]&&!S.own[k])?DEFS[k]():S[k]}

/* ---------- field definitions ---------- */
const FD={
  price:{l:'Purchase price',t:'$',min:100000,max:3000000,st:5000},
  downPct:{l:'Down payment',t:'%',min:5,max:50,st:0.5},
  downAmt:{l:'Down payment',t:'$',min:0,max:1000000,st:1000,mx:()=>S.price},
  rate:{l:'Interest rate',t:'%',min:0.5,max:12,st:0.05},
  amort:{l:'Amortization',t:'yrs',min:5,max:35,st:1},
  term:{l:'Term',t:'yrs',min:1,max:10,st:1},
  income:{l:'Gross annual income',t:'$',min:20000,max:600000,st:1000},
  debts:{l:'Monthly debt payments',t:'$',min:0,max:5000,st:25},
  ptax:{l:'Property tax (yearly)',t:'$',min:0,max:15000,st:100},
  heat:{l:'Heat / utilities (monthly)',t:'$',min:0,max:500,st:10},
  strata:{l:'Strata fee (monthly)',t:'$',min:0,max:1500,st:10},
  rent:{l:'Rental income (monthly)',t:'$',min:0,max:6000,st:50},
  gdsLim:{l:'GDS limit',t:'%',min:30,max:60,st:0.5},
  tdsLim:{l:'TDS limit',t:'%',min:30,max:60,st:0.5},
  reqLoan:{l:'Mortgage amount',t:'$',min:50000,max:3000000,st:5000},
  gstAmt:{l:'GST (5%)',t:'$',min:0,max:150000,st:500,ns:1},
  gstRebate:{l:'GST rebate',t:'$',min:0,max:50000,st:500,ns:1},
  cA_loan:{l:'Mortgage',t:'$',min:50000,max:3000000,st:5000},cB_loan:{l:'Mortgage',t:'$',min:50000,max:3000000,st:5000},
  cA_rate:{l:'Rate',t:'%',min:0.5,max:12,st:0.05},cB_rate:{l:'Rate',t:'%',min:0.5,max:12,st:0.05},
  cA_amort:{l:'Amortization',t:'yrs',min:5,max:35,st:1},cB_amort:{l:'Amortization',t:'yrs',min:5,max:35,st:1},
  cA_term:{l:'Term',t:'yrs',min:1,max:10,st:1},cB_term:{l:'Term',t:'yrs',min:1,max:10,st:1},
  rValue:{l:'Home value',t:'$',min:100000,max:4000000,st:5000},
  rBal:{l:'Current balance',t:'$',min:0,max:3000000,st:5000},
  rCurRate:{l:'Current rate',t:'%',min:0.5,max:12,st:0.05},
  rMonths:{l:'Months left in term',t:'mo',min:0,max:120,st:1},
  rRemAmort:{l:'Remaining amortization',t:'yrs',min:1,max:30,st:1},
  rCurPmt:{l:'Current monthly payment',t:'$',min:0,max:15000,st:10},
  rComp:{l:'IRD comparison rate',t:'%',min:0,max:12,st:0.05},
  rPenMan:{l:'Penalty amount',t:'$',min:0,max:100000,st:250},
  rRate:{l:'New rate',t:'%',min:0.5,max:12,st:0.05},
  rAmort:{l:'New amortization',t:'yrs',min:5,max:30,st:1},
  rLTV:{l:'Max LTV',t:'%',min:50,max:95,st:1},
  rNew:{l:'New mortgage amount',t:'$',min:0,max:3000000,st:5000,mx:()=>v('rValue')*v('rLTV')/100},
  rDebts:{l:'Debts to pay off',t:'$',min:0,max:300000,st:500},
  rDebtPmt:{l:'Monthly payments on those debts',t:'$',min:0,max:10000,st:25},
  rFees:{l:'Legal / appraisal / fees',t:'$',min:0,max:10000,st:100}
};
const FREQ={monthly:{n:12,l:'Monthly'},semi:{n:24,l:'Semi-monthly'},biweekly:{n:26,l:'Bi-weekly'},accbi:{n:26,l:'Accelerated bi-weekly'},weekly:{n:52,l:'Weekly'},accwk:{n:52,l:'Accelerated weekly'}};

/* ---------- math ---------- */
function per(rate,n){const c=SET.compound==='monthly'?12:2;return Math.pow(1+rate/100/c,c/n)-1}
function pmt(L,rate,yrs,n){if(!(L>0))return 0;const r=per(rate,n),N=Math.round(yrs*n);if(N<=0)return L;return r===0?L/N:L*r/(1-Math.pow(1+r,-N))}
function pv(P,rate,yrs,n){if(!(P>0))return 0;const r=per(rate,n),N=Math.round(yrs*n);return r===0?P*N:P*(1-Math.pow(1+r,-N))/r}
function payment(L,rate,amort,f){const m=pmt(L,rate,amort,12);if(f==='monthly')return m;if(f==='accbi')return m/2;if(f==='accwk')return m/4;return pmt(L,rate,amort,FREQ[f].n)}
function run(L,rate,amort,term,f){
  const n=FREQ[f].n,P=payment(L,rate,amort,f),r=per(rate,n),termN=Math.round(term*n),maxN=Math.round(amort*n)+n*10;
  let b=L,k=0,ti=0,tp=0,ai=0,yi=0,yp=0,termBal=null;const years=[];
  while(b>0.005&&k<maxN){const i=b*r;let pr=P-i;if(pr>b)pr=b;if(pr<=0)break;b-=pr;k++;ai+=i;yi+=i;yp+=pr;
    if(k<=termN){ti+=i;tp+=pr}if(k===termN)termBal=b;
    if(k%n===0||b<=0.005){years.push({y:Math.ceil(k/n),i:yi,p:yp,b:Math.max(b,0)});yi=0;yp=0}}
  if(termBal===null)termBal=b>0.005?b:0;
  return {P,ti,tp,termBal,ai,years,payoff:k/n}}
function qualRate(rate){return SET.ovOn?+SET.ovRate:Math.max(+rate+ +SET.buffer,+SET.floor)}
function pttCalc(p){return Math.min(p,2e5)*.01+Math.max(0,Math.min(p,2e6)-2e5)*.02+Math.max(0,p-2e6)*.03+Math.max(0,p-3e6)*.02}

let _deal=null;
function deal(){if(_deal)return _deal;
  const price=+S.price||0;let down=S.downMode==='pct'?price*S.downPct/100:+S.downAmt||0;down=Math.min(Math.max(down,0),price);
  const pct=price?down/price*100:0,base=price-down,ltv=price?base/price*100:0,insured=base>0&&pct<19.9999;
  let premRate=0;if(insured){premRate=ltv>90?+SET.prem95:ltv>85?+SET.prem90:+SET.prem85;if(S.amort>25)premRate+= +SET.surcharge}
  const premium=base*premRate/100,loan=base+premium;
  const minDown=price<=5e5?price*.05:price<1.5e6?25000+(price-5e5)*.1:price*.2;
  const w=[];
  if(price>=1.5e6&&pct<20)w.push('Insured max price is under $1.5M. This price needs 20% down.');
  else if(down<minDown-1)w.push('Below minimum down payment of '+$(minDown)+' ('+(minDown/price*100).toFixed(2)+'%).');
  if(insured&&S.amort>30)w.push('Insured deals max out at 30 years.');
  else if(insured&&S.amort>25)w.push('30-year insured: first-time buyer or new build only. +'+SET.surcharge+'% premium added.');
  return _deal={price,down,pct,base,ltv,insured,premRate,premium,loan,minDown,warn:w.join('\n')}}

function ratios(loan,rate,amort){
  const q=qualRate(rate),qp=pmt(loan,q,amort,12),tax=(+v('ptax')||0)/12,heat=+v('heat')||0,str=(+v('strata')||0)*SET.strataPct/100,
        debts=+v('debts')||0,rent=+v('rent')||0,baseInc=(+v('income')||0)/12;
  let inc=baseInc,off=0,add=0;
  if(rent>0){if(SET.rentMethod==='add'){add=rent*SET.rentAdd/100;inc+=add}else off=rent*SET.rentOff/100}
  const housing=Math.max(0,qp+tax+heat+str-off);
  const gds=inc>0?housing/inc*100:0,tds=inc>0?(housing+debts)/inc*100:0,gl=+v('gdsLim'),tl=+v('tdsLim');
  const maxPI=Math.min(gl/100*inc,tl/100*inc-debts)-(tax+heat+str)+off,maxLoan=pv(Math.max(0,maxPI),q,amort,12);
  const needG=housing/(gl/100),needT=(housing+debts)/(tl/100),need=Math.max(needG,needT)-add;
  return {q,qp,tax,heat,str,debts,rent,off,add,inc,housing,gds,tds,gl,tl,maxLoan,needAnnual:Math.max(0,need*12),bind:needT>needG?'TDS':'GDS',
    gOk:gds<=gl+1e-9,tOk:tds<=tl+1e-9}}

/* ---------- formatting ---------- */
function $(x){if(!isFinite(x))return '-';return (x<0?'-$':'$')+Math.round(Math.abs(x)).toLocaleString('en-CA')}
function $c(x){if(!isFinite(x))return '-';return (x<0?'-$':'$')+Math.abs(x).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})}
function sgn(x,f){f=f||$;return (x>0.004?'+':'')+f(x)}
function pc(x,d){return isFinite(x)?(+x).toFixed(d==null?2:d)+'%':'-'}
function yrs(x){const y=Math.floor(x+1e-9),m=Math.round((x-y)*12);return m===12?(y+1)+' yrs':y+' yrs'+(m?' '+m+' mo':'')}
function fmtIn(k,x){const t=FD[k].t;if(x===''||x==null||!isFinite(x))return '';if(t==='$')return Math.round(x).toLocaleString('en-CA');return String(+(+x).toFixed(3))}
function parse(s){s=String(s).replace(/[^0-9.\-]/g,'');const n=parseFloat(s);return isFinite(n)?n:0}

/* ---------- UI builders ---------- */
function F(k,label){const f=FD[k];const unit=f.t==='$'?'':`<span class="unit">${f.t==='yrs'?'yrs':f.t==='mo'?'mo':'%'}</span>`;
  return `<div class="fld"><div class="frow"><label>${label||f.l}</label>${DEFS[k]?`<button class="relink" data-relink="${k}">&#8634;</button>`:''}
  <div class="inbox">${f.t==='$'?'<span class="pre">$</span>':''}<input class="num" data-k="${k}" inputmode="decimal" autocomplete="off">${unit}</div></div>
  ${f.ns?'':`<div class="rng"><input type="range" data-k="${k}" min="${f.min}" max="${f.max}" step="${f.st}" tabindex="-1"></div>`}</div>`}
function DOWN(){return `<div class="fld" style="border-bottom:0;padding-bottom:0"><div class="frow"><label>Down payment as</label>
  <div class="seg"><button data-dm="pct">%</button><button data-dm="amt">$</button></div></div></div>
  <div data-show="dmPct">${F('downPct')}</div><div data-show="dmAmt">${F('downAmt')}</div><div class="hint" data-o="downHint"></div>`}
function SEL(k,label,opts){return `<div class="fld"><div class="frow"><label>${label}</label>${DEFS[k]?`<button class="relink" data-relink="${k}">&#8634;</button>`:''}
  <select data-k="${k}">${Object.entries(opts).map(([a,b])=>`<option value="${a}">${b}</option>`).join('')}</select></div></div>`}
const FREQOPT=Object.fromEntries(Object.entries(FREQ).map(([a,b])=>[a,b.l]));
function TOG(k,label){return `<label class="tog"><span>${label}</span><input type="checkbox" data-k="${k}"></label>`}
function KV(l,o,cls){return `<div class="kv"><span class="lbl">${l}</span><b data-o="${o}" ${cls?`data-c="${o}"`:''}></b></div>`}
function card(title,body,cls){return `<div class="card ${cls||''}">${title?`<h3>${title}</h3>`:''}${body}</div>`}

const TABS=[['pay','Payment'],['stress','Stress'],['buy','Purchase'],['close','Closing'],['refi','Refi'],['inc','Income'],['cmp','Compare']];
function build(){

    +card('',F('reqLoan')+F('rate')+F('amort'))

     <div class="note" data-o="cmpNote"></div>`,'hero')
    +`<div class="grid2">${col('A')}${col('B')}</div>`;
  $main.innerHTML=TABS.map(([id])=>`<section class="tab" id="t-${id}">${T[id]}</section>`).join('');
  $nav.innerHTML=TABS.map(([id,l])=>`<button data-tab="${id}">${l}</button>`).join('');
}
const $main=document.getElementById('main'),$nav=document.getElementById('nav');

/* ---------- compute all outputs ---------- */
function compute(){
  _deal=null;const d=deal(),O={},C={};
  const R=run(d.loan,S.rate,S.amort,S.term,S.freq);
  O.freqLbl=FREQ[S.freq].l+' payment';O.pay=$c(R.P);O.loan=$(d.loan);O.prem=$(d.premium);O.premRate=pc(d.premRate);O.insured=d.insured;
  O.warn=d.warn;O.dmPct=S.downMode==='pct';O.dmAmt=!O.dmPct;O.downHint=O.dmPct?'= '+$(d.down):'= '+pc(d.pct);
  O.termY=S.term+' yrs';O.tInt=$(R.ti);O.tPrin=$(R.tp);O.tBal=$(R.termBal);O.aInt=$(R.ai);O.aYrs=yrs(R.payoff);O.mEq=$c(R.P*FREQ[S.freq].n/12);
  O._years=R.years;
  // stress
  const q=ratios(d.loan,S.rate,S.amort);
  O.qRate=pc(q.q);O.qPmt=$c(q.qp);O.cPmt=$c(pmt(d.loan,S.rate,S.amort,12));O.gds=pc(q.gds);O.tds=pc(q.tds);O.gl=pc(q.gl,1);O.tl=pc(q.tl,1);
  C.gds=q.gOk;C.tds=q.tOk;const pass=q.gOk&&q.tOk;O.qPass=pass?'PASS':'FAIL';C.qPass=pass;
  O.qRule=SET.ovOn?'Manual stress rate from settings: '+pc(SET.ovRate)+'.':'Higher of contract + '+SET.buffer+'% or '+pc(SET.floor)+'. Change in settings (HELOC etc).';
  O.maxLoan=$(q.maxLoan);O.loan2=$(d.loan);O.room=sgn(q.maxLoan-d.loan);C.room=q.maxLoan>=d.loan;
  O.strataPct=SET.strataPct+'%';O.limNote=(d.insured?'Insured':'Conventional')+' default: '+(d.insured?SET.insGDS+'/'+SET.insTDS:SET.convGDS+'/'+SET.convTDS)+'. Tap the arrow to reset.';
  O.rentOn=q.rent>0;
  O.rentNote=SET.rentMethod==='add'?SET.rentAdd+'% of rent ('+$(q.add)+'/mo) added to income. Change method in settings.':SET.rentOff+'% of rent ('+$(q.off)+'/mo) offsets housing costs. Change method in settings.';
  O.rentNoteI=O.rentNote+(SET.rentMethod==='add'?' Required income shown is before rent.':'');
  // purchase
  const pi=pmt(d.loan,S.rate,S.amort,12),tax=(+S.ptax||0)/12,str=+S.strata||0,heat=+v('heat')||0,all=pi+tax+str+heat;
  O.allIn=$c(all);O.bPI=$c(pi);O.bTax=$c(tax);O.bStr=$c(str);O.bHeat=$c(heat);O.bNet=$c(all-(+S.rent||0));
  O.bDown=$(d.down)+' ('+pc(d.pct,1)+')';O.gdsL=pc(q.gds)+' / '+pc(q.gl,1);O.tdsL=pc(q.tds)+' / '+pc(q.tl,1);C.gdsL=q.gOk;C.tdsL=q.tOk;
  // closing
  const p=+S.price||0,ptt=pttCalc(p);let f=0,nb=0;
  if(S.fthb){if(p<=835000)f=pttCalc(Math.min(p,5e5));else if(p<860000)f=pttCalc(5e5)*(860000-p)/25000}
  if(S.newBuild){if(p<=1.1e6)nb=ptt;else if(p<1.15e6)nb=ptt*(1.15e6-p)/5e4}
  const ex=Math.max(f,nb);O.ptt=$(ptt);O.exOn=ex>0;O.ex='-'+$(ex);O.exLbl=nb>=f?'Newly built exemption':'First-time buyer exemption';O.pttNet=$(ptt-ex);
  O.exNote=(S.fthb&&p>=860000?'Over $860K: no first-time buyer exemption. ':'')+(S.newBuild&&p>=1.15e6?'Over $1.15M: no newly built exemption. ':'')+(S.fthb&&S.newBuild?'Can\'t combine both; using the bigger one.':'');
  O.nb=S.newBuild;O.gstOn=S.gstOn;const gst=S.newBuild&&S.gstOn?(+v('gstAmt')||0)-(+S.gstRebate||0):0;
  const items=S.closing.reduce((a,x)=>a+(+x.a||0),0),clTot=ptt-ex+gst+items;O.clTot=$(clTot);O.cash=$(clTot+d.down);
  // refi
  const val=+v('rValue'),bal=+v('rBal'),cr=+v('rCurRate'),mo=+v('rMonths'),rem=+v('rRemAmort'),nr=+v('rRate');
  const p3=bal*cr/100/4,ird=bal*Math.max(0,cr-(+S.rComp))/100*mo/12,pen=S.rPen==='manual'?+S.rPenMan:S.rPen==='3mo'?p3:Math.max(p3,ird);
  O.pen3=$(p3);O.penI=$(ird);O.pen=$(pen);O.penIRD=S.rPen==='greater';O.penMan=S.rPen==='manual';
  const oR=run(bal,cr,rem,mo/12,'monthly'),nR=run(bal,nr,rem,mo/12,'monthly'),saved=oR.ti-nR.ti,net=saved-pen-(+S.rFees||0);
  O.bsSave=$(saved);O.bsNet=sgn(net);C.bsNet=net>=0;const pchg=pmt(bal,nr,rem,12)-(+v('rCurPmt'));O.bsPmt=sgn(pchg,$c)+'/mo';C.bsPmt=pchg<=0;
  const perMo=mo>0?saved/mo:0;O.bsBE=perMo>0?Math.ceil((pen+(+S.rFees||0))/perMo)+' months'+(((pen+(+S.rFees||0))/perMo)>mo?' (past term end)':''):'Never';
  const max=val*v('rLTV')/100,nw=+v('rNew'),eqCash=nw-bal-(+S.rDebts||0)-(S.rRoll?pen:0);
  O.ltvL=pc(v('rLTV'),0);O.eqMax=$(max);O.eqAvail=$(max-bal);O.eqCash=$(eqCash);C.eqCash=eqCash>=0;
  const np=pmt(nw,nr,+v('rAmort'),12),op=(+v('rCurPmt'))+(+S.rDebtPmt||0);O.eqPmt=$c(np);O.eqOld=$c(op);O.eqChg=sgn(np-op,$c)+'/mo';C.eqChg=np<=op;
  const rw=[];if(nw>max+1)rw.push('New mortgage is over '+pc(v('rLTV'),0)+' of value.');if(eqCash<0)rw.push('New mortgage doesn\'t cover balance, debts and penalty.');O.rWarn=rw.join('\n');
  // required income
  const qi=ratios(+v('reqLoan'),S.rate,S.amort);O.need=$(qi.needAnnual);O.needM=$(qi.needAnnual/12);O.bind=qi.bind;O.iqPmt=$c(qi.qp);O.iHouse=$c(qi.housing);
  // compare
  const A=run(+v('cA_loan'),+v('cA_rate'),+v('cA_amort'),+v('cA_term'),v('cA_freq')),B=run(+v('cB_loan'),+v('cB_rate'),+v('cB_amort'),+v('cB_term'),v('cB_freq'));
  for(const [x,r] of [['A',A],['B',B]]){O['c'+x+'P']=$c(r.P);O['c'+x+'I']=$(r.ti);O['c'+x+'Pr']=$(r.tp);O['c'+x+'B']=$(r.termBal);O['c'+x+'T']=$(r.ai)}
  const nz=(x,t,good)=>Math.abs(x)<t?undefined:good;O.dP=sgn(B.P-A.P,$c);C.dP=nz(B.P-A.P,.005,B.P<A.P);O.dI=sgn(B.ti-A.ti);C.dI=nz(B.ti-A.ti,.5,B.ti<A.ti);O.dPr=sgn(B.tp-A.tp);C.dPrG=nz(B.tp-A.tp,.5,B.tp>A.tp);O.dB=sgn(B.termBal-A.termBal);C.dB=nz(B.termBal-A.termBal,.5,B.termBal<A.termBal);
  O.cmpNote=(v('cA_freq')!==v('cB_freq')?'Different frequencies: payment difference is per payment. ':'')+(+v('cA_term')!==+v('cB_term')?'Different terms: term totals cover different periods.':'');
  return {O,C}}

/* ---------- render ---------- */
let saveT=null;
function refresh(){
  const {O,C}=compute();
  document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
    if(el.type==='checkbox'){el.checked=!!S[k];return}
    if(el.tagName==='SELECT'){el.value=v(k);return}
    const x=v(k);
    if(el.type==='range'){const f=FD[k];if(f.mx)el.max=Math.max(f.min,Math.round(f.mx()));el.value=x;const mn=+el.min,mxx=+el.max;el.style.setProperty('--p',(mxx>mn?(el.value-mn)/(mxx-mn)*100:0)+'%');return}
    if(el===document.activeElement)return;el.value=fmtIn(k,x)});
  document.querySelectorAll('[data-relink]').forEach(b=>b.classList.toggle('show',!!S.own[b.dataset.relink]));
  document.querySelectorAll('[data-o]').forEach(el=>{const o=O[el.dataset.o];if(typeof o==='string')el.textContent=o});
  document.querySelectorAll('[data-c]').forEach(el=>{const c=C[el.dataset.c];el.classList.toggle('ok',c===true);el.classList.toggle('bad',c===false)});
  document.querySelectorAll('[data-show]').forEach(el=>{el.hidden=!O[el.dataset.show]});
  document.querySelectorAll('[data-dm]').forEach(b=>b.classList.toggle('on',(b.dataset.dm==='pct')===(S.downMode==='pct')));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+S.tab));
  document.getElementById('schedBtn').textContent=S.sched?'Hide yearly schedule':'Show yearly schedule';
  document.getElementById('sched').innerHTML=S.sched?`<table><tr><th>Yr</th><th>Interest</th><th>Principal</th><th>Balance</th></tr>${O._years.map(y=>`<tr><td>${y.y}</td><td>${$(y.i)}</td><td>${$(y.p)}</td><td>${$(y.b)}</td></tr>`).join('')}</table>`:'';
  document.getElementById('scnName').textContent=S.name||'';
  clearTimeout(saveT);saveT=setTimeout(()=>LS.set('mmc.cur',S),250);
}
function renderItems(){document.getElementById('items').innerHTML=S.closing.map((x,i)=>`<div class="item"><input class="nm" data-in="${i}" value="${esc(x.n)}">
  <div class="inbox"><span class="pre">$</span><input class="num" data-ia="${i}" inputmode="decimal" value="${Math.round(+x.a||0).toLocaleString('en-CA')}"></div><button class="x" data-ix="${i}">&times;</button></div>`).join('')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function setVal(k,x){
  if(k==='downPct'){S.downPct=x;S.downAmt=S.price*x/100}
  else if(k==='downAmt'){S.downAmt=x;S.downPct=S.price?x/S.price*100:0}
  else if(k==='price'){S.price=x;if(S.downMode==='pct')S.downAmt=x*S.downPct/100;else S.downPct=x?S.downAmt/x*100:0}
  else S[k]=x;
  if(DEFS[k])S.own[k]=true;
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.in!=null){S.closing[+el.dataset.in].n=el.value;LS.set('mmc.cur',S);return}
  if(el.dataset.ia!=null){S.closing[+el.dataset.ia].a=parse(el.value);refresh();return}
  if(el.dataset.s!=null){setSetting(el);return}
  const k=el.dataset.k;if(!k||el.type==='checkbox'||el.tagName==='SELECT')return;
  setVal(k,el.type==='range'?parseFloat(el.value):parse(el.value));refresh()});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.s!=null){setSetting(el);return}
  const k=el.dataset.k;if(!k)return;
  if(el.type==='checkbox'){S[k]=el.checked;refresh()}else if(el.tagName==='SELECT'){S[k]=el.value;if(DEFS[k])S.own[k]=true;refresh()}});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('num'))setTimeout(refresh,0)});
document.addEventListener('focusin',e=>{const el=e.target;if(el.classList&&el.classList.contains('num'))setTimeout(()=>{try{el.select()}catch(_){}},0)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){S.tab=b.dataset.tab;refresh();window.scrollTo(0,0);return}
  if(b.dataset.relink){delete S.own[b.dataset.relink];refresh();return}
  if(b.dataset.dm){if(S.downMode!==b.dataset.dm){S.downMode=b.dataset.dm}refresh();return}
  if(b.dataset.ix!=null){S.closing.splice(+b.dataset.ix,1);renderItems();refresh();return}
  if(b.id==='addItem'){S.closing.push({n:'New item',a:0});renderItems();refresh();return}
  if(b.id==='saveDefs'){SET.closing=S.closing.map(x=>[x.n,+x.a||0]);LS.set('mmc.set',SET);b.textContent='Saved';setTimeout(()=>b.textContent='Save as my defaults',1200);return}
  if(b.id==='schedBtn'){S.sched=!S.sched;refresh();return}
  if(b.id==='btnSet'){openSettings();return}
  if(b.id==='btnSaves'){openSaves();return}
  if(b.id==='btnPdf'){makePdf();return}
  if(b.id==='pdfShare'){sharePdf();return}
  if(b.id==='pdfSave'){savePdf();return}
  if(b.dataset.close!=null){closeSheet();return}
  if(b.id==='doSave'){doSave();return}
  if(b.dataset.load){loadSave(b.dataset.load);return}
  if(b.dataset.del){delSave(b.dataset.del);return}
  if(b.id==='newScn'){if(confirm('Start a new blank scenario? Unsaved changes are lost.')){const t=S.tab;S=DEF_S();S.tab=t;renderItems();closeSheet();refresh()}return}
  if(b.id==='resetSet'){if(confirm('Reset all settings to defaults?')){SET=Object.assign({},DEF_SET);LS.set('mmc.set',SET);openSettings();refresh()}return}
});
document.getElementById('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

/* ---------- sheets ---------- */
const $panel=document.getElementById('panel');
function openSheet(html){$panel.innerHTML=html;document.getElementById('sheet').classList.remove('hidden')}
function closeSheet(){document.getElementById('sheet').classList.add('hidden')}
function sNum(k,l,u){return `<div class="srow"><span>${l}</span><input class="sn" data-s="${k}" inputmode="decimal" value="${SET[k]}">${u||''}</div>`}
function openSettings(){openSheet(`<div class="phead"><b>Settings</b><button data-close>Done</button></div>
  <h3 style="margin-top:12px">Stress test</h3>${sNum('buffer','Contract rate +','%')}${sNum('floor','Or minimum rate','%')}
  <label class="tog"><span>Manual stress rate (HELOC etc.)</span><input type="checkbox" data-s="ovOn" ${SET.ovOn?'checked':''}></label>${sNum('ovRate','Manual rate','%')}
  <h3 style="margin-top:14px">Ratio limits</h3>${sNum('insGDS','Insured GDS','%')}${sNum('insTDS','Insured TDS','%')}${sNum('convGDS','Conventional GDS','%')}${sNum('convTDS','Conventional TDS','%')}
  ${sNum('heat','Default heat','$/mo')}${sNum('strataPct','Strata counted at','%')}
  <h3 style="margin-top:14px">Rental income</h3><div class="srow"><span>Method</span><select data-s="rentMethod"><option value="add" ${SET.rentMethod==='add'?'selected':''}>Add to income</option><option value="off" ${SET.rentMethod==='off'?'selected':''}>Offset</option></select></div>
  ${sNum('rentAdd','Add to income at','%')}${sNum('rentOff','Offset at','%')}
  <h3 style="margin-top:14px">Insurance premiums</h3>${sNum('prem85','80.01 to 85% LTV','%')}${sNum('prem90','85.01 to 90% LTV','%')}${sNum('prem95','90.01 to 95% LTV','%')}${sNum('surcharge','Over 25 yr surcharge','%')}
  <h3 style="margin-top:14px">Math</h3><div class="srow"><span>Compounding</span><select data-s="compound"><option value="semi" ${SET.compound==='semi'?'selected':''}>Semi-annual (fixed)</option><option value="monthly" ${SET.compound==='monthly'?'selected':''}>Monthly (variable)</option></select></div>
  <div class="row" style="margin-top:14px"><button id="resetSet">Reset settings</button></div>`)}
function setSetting(el){const k=el.dataset.s;SET[k]=el.type==='checkbox'?el.checked:el.tagName==='SELECT'?el.value:parse(el.value);LS.set('mmc.set',SET);refresh()}
function saves(){return LS.get('mmc.saves',{})}
function openSaves(){const sv=saves(),names=Object.keys(sv).sort((a,b)=>sv[b].t-sv[a].t);
  openSheet(`<div class="phead"><b>Saved scenarios</b><button data-close>Done</button></div>
  <div class="row"><input class="txt" id="saveName" placeholder="Client name" value="${esc(S.name||'')}"></div>
  <div class="row"><button class="pri" id="doSave" style="flex:1">Save</button><button id="newScn">New blank</button></div>
  <div style="margin-top:10px">${names.length?names.map(n=>`<div class="save"><div><b>${esc(n)}</b><br><small>${new Date(sv[n].t).toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})} &middot; ${$(sv[n].s.price)}</small></div>
  <button data-load="${esc(n)}">Open</button><button class="x" data-del="${esc(n)}" style="color:var(--bad)">&times;</button></div>`).join(''):'<div class="note">Nothing saved yet.</div>'}</div>`)}
function doSave(){const n=document.getElementById('saveName').value.trim();if(!n){document.getElementById('saveName').focus();return}
  const sv=saves();if(sv[n]&&n!==S.name&&!confirm('Overwrite "'+n+'"?'))return;S.name=n;sv[n]={t:Date.now(),s:JSON.parse(JSON.stringify(S))};LS.set('mmc.saves',sv);refresh();LS.set('mmc.cur',S);openSaves()}
function loadSave(n){const sv=saves();if(!sv[n])return;const t=S.tab;S=Object.assign(DEF_S(),JSON.parse(JSON.stringify(sv[n].s)));S.tab=t;S.name=n;renderItems();closeSheet();refresh()}
function delSave(n){if(!confirm('Delete "'+n+'"?'))return;const sv=saves();delete sv[n];LS.set('mmc.saves',sv);openSaves()}

/* ---------- sliders: only move when the knob is grabbed ---------- */
const TW=28;let drag=null;
function thumbX(r){const b=r.getBoundingClientRect(),mn=+r.min,mx=+r.max,p=mx>mn?(r.value-mn)/(mx-mn):0;return b.left+TW/2+p*(b.width-TW)}
function rngStart(x,w){const r=w.querySelector('input[type=range]');if(!r||Math.abs(x-thumbX(r))>26)return false;drag={r,w};w.classList.add('drag');return true}
function rngMove(x){if(!drag)return;const r=drag.r,b=r.getBoundingClientRect(),mn=+r.min,mx=+r.max,st=+r.step||1;
  let p=(x-b.left-TW/2)/(b.width-TW);p=Math.min(1,Math.max(0,p));let val=Math.round(p*(mx-mn)/st)*st+mn;val=Math.min(mx,+val.toFixed(4));
  if(+r.value!==val){r.value=val;r.dispatchEvent(new Event('input',{bubbles:true}))}}
function rngEnd(){if(drag){drag.w.classList.remove('drag');drag=null}}
document.addEventListener('touchstart',e=>{const w=e.target.closest&&e.target.closest('.rng');if(w&&e.touches.length===1&&rngStart(e.touches[0].clientX,w))e.preventDefault()},{passive:false});
document.addEventListener('touchmove',e=>{if(drag){e.preventDefault();rngMove(e.touches[0].clientX)}},{passive:false});
document.addEventListener('touchend',rngEnd);document.addEventListener('touchcancel',rngEnd);
document.addEventListener('mousedown',e=>{const w=e.target.closest&&e.target.closest('.rng');if(w&&rngStart(e.clientX,w))e.preventDefault()});
document.addEventListener('mousemove',e=>{if(drag)rngMove(e.clientX)});document.addEventListener('mouseup',rngEnd);

/* ---------- client PDF ---------- */
let lastPdf=null;
function loadPdfLib(){if(window.jspdf)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');s.src='jspdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('PDF tool did not load. Check your connection.'));document.head.appendChild(s)})}
async function makePdf(){const b=document.getElementById('btnPdf');b.textContent='...';b.disabled=true;
  try{await loadPdfLib();const sp=pdfSpec(),doc=renderPdf(sp);
    const fname=('Mack Mortgages - '+sp.title+(S.name?' - '+S.name:'')).replace(/[\\/:*?"<>|]/g,'')+'.pdf';
    lastPdf=new File([doc.output('blob')],fname,{type:'application/pdf'});
    const canShare=!!(navigator.canShare&&navigator.canShare({files:[lastPdf]}));
    openSheet(`<div class="phead"><b>PDF ready</b><button data-close>Done</button></div><div class="note" style="margin-bottom:6px">${esc(fname)}</div>
      ${S.name?'':'<div class="warn">No client name on it. Save the scenario under the client\'s name first if you want "Prepared for" on the PDF.</div>'}
      <div class="row">${canShare?'<button class="pri" id="pdfShare" style="flex:1">Send / Share</button>':''}<button id="pdfSave" style="flex:1">Save to phone</button></div>`)}
  catch(e){alert('Could not make the PDF. '+e.message)}
  finally{b.textContent='PDF';b.disabled=false}}
function sharePdf(){if(!lastPdf)return;navigator.share({files:[lastPdf],title:lastPdf.name}).catch(()=>{})}
function savePdf(){if(!lastPdf)return;const u=URL.createObjectURL(lastPdf),a=document.createElement('a');a.href=u;a.download=lastPdf.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

function pdfSpec(){
  const {O}=compute(),d=deal(),t=S.tab,R=(l,x)=>[l,x],rate=pc(S.rate),am=S.amort+' years',fq=FREQ[S.freq].l;
  const gen='These numbers are estimates to help you plan. They are not a mortgage approval, and rates are not guaranteed. Final numbers depend on the lender and your full application.';
  const prem=d.insured?[R('Mortgage insurance premium (added to the mortgage)',O.prem)]:[];
  const sp={title:'',hero:[],sections:[],table:null,notes:[gen]};
  if(t==='pay'){sp.title='Mortgage Payment';
    sp.hero=[[fq+' payment',O.pay,'On a mortgage of '+O.loan+' at '+rate],['Balance at renewal',O.tBal,'After your '+S.term+'-year term']];
    sp.sections=[{h:'Your mortgage',rows:[R('Purchase price',$(d.price)),R('Down payment',O.bDown),...prem,R('Total mortgage',O.loan),R('Interest rate',rate),R('Amortization',am),R('Term',S.term+' years'),R('Payment frequency',fq),R('Payment',O.pay)]},
      {h:'Over your '+S.term+'-year term',rows:[R('Interest paid',O.tInt),R('Principal paid off',O.tPrin),R('Balance at renewal',O.tBal)]},
      {h:'Over the full amortization',rows:[R('Total interest',O.aInt),R('Paid off in',O.aYrs)]}];
    sp.table={h:'Year by year',head:['Year','Interest','Principal','Balance'],rows:O._years.map(y=>[String(y.y),$(y.i),$(y.p),$(y.b)])};
    sp.notes=['Assumes the same rate for the full amortization. Your rate is reset at each renewal.',gen]}
  else if(t==='stress'){const q=ratios(d.loan,S.rate,S.amort),pass=q.gOk&&q.tOk;sp.title='Stress Test';
    sp.hero=[['Qualifying payment (monthly)',O.qPmt,'Tested at '+O.qRate],['Result',pass?'Meets limits':'Over limits','GDS '+O.gds+'   TDS '+O.tds]];
    sp.sections=[{h:'How the stress test works',text:SET.ovOn?'Lenders check that you can afford the payment at a qualifying rate of '+pc(SET.ovRate)+'.':'Lenders check that you can afford the payment at the higher of your rate plus '+SET.buffer+'% or '+pc(SET.floor)+'. Your rate is '+rate+', so you are tested at '+O.qRate+'.'},
      {h:'Your numbers',rows:[R('Gross yearly income',$(+S.income)),R('Monthly debt payments',$(q.debts)),...(q.rent>0?[R('Rental income (monthly)',$(q.rent))]:[]),R('Property tax (yearly)',$(+S.ptax)),R('Heat (monthly)',$(q.heat)),R('Strata fee (monthly)',$(+S.strata)),R('Mortgage',O.loan),R('Amortization',am)]},
      {h:'Results',rows:[R('Your payment at '+rate+' (monthly)',O.cPmt),R('Qualifying payment at '+O.qRate,O.qPmt),R('GDS: housing costs vs income',O.gds+' of '+O.gl+' max'),R('TDS: housing costs plus debts vs income',O.tds+' of '+O.tl+' max'),R('Max mortgage with these numbers',O.maxLoan)]}];
    sp.notes=['Housing costs are the qualifying payment, property tax, heat and '+SET.strataPct+'% of strata fees. Lender rules can vary.',gen]}
  else if(t==='buy'){const q=ratios(d.loan,S.rate,S.amort);sp.title='Purchase Summary';
    sp.hero=[['Estimated all-in monthly cost',O.allIn,'Mortgage, property tax, strata and heat'],['Cash needed to close',O.cash,'Down payment plus closing costs']];
    sp.sections=[{h:'Monthly costs',rows:[R('Mortgage payment',O.bPI),R('Property tax',O.bTax),R('Strata fee',O.bStr),R('Heat / utilities',O.bHeat),R('Total',O.allIn),...(q.rent>0?[R('Rental income',$c(q.rent)),R('Total after rental income',O.bNet)]:[])]},
      {h:'The purchase',rows:[R('Purchase price',$(d.price)),R('Down payment',O.bDown),...prem,R('Total mortgage',O.loan),R('Interest rate',rate),R('Amortization',am)]},
      {h:'Qualifying',rows:[R('Gross yearly income',$(+S.income)),R('Monthly debt payments',$(q.debts)),R('Qualifying rate',O.qRate),R('GDS (limit)',O.gdsL),R('TDS (limit)',O.tdsL),R('Max mortgage with these numbers',O.maxLoan)]},
      {h:'Cash to close',rows:[R('Down payment',$(d.down)),R('Closing costs (estimate)',O.clTot),R('Total',O.cash)]}];
    sp.notes=['Closing costs include property transfer tax and other estimated costs. Tax figures are estimates only and are not tax or legal advice. Please confirm with your lawyer or notary.',gen]}
  else if(t==='close'){sp.title='Closing Costs';
    sp.hero=[['Estimated closing costs',O.clTot,'Not including your down payment'],['Cash needed to close',O.cash,'Includes your '+$(d.down)+' down payment']];
    const ptt=[R('Property transfer tax',O.ptt)];if(O.exOn)ptt.push(R(O.exLbl,O.ex));ptt.push(R('Property transfer tax payable',O.pttNet));
    sp.sections=[{h:'The purchase',rows:[R('Purchase price',$(d.price)),R('First-time home buyer',S.fthb?'Yes':'No'),R('Newly built home',S.newBuild?'Yes':'No')]},{h:'Property transfer tax',rows:ptt}];
    if(S.newBuild&&S.gstOn)sp.sections.push({h:'GST (new home)',rows:[R('GST',$(+v('gstAmt'))),...(+S.gstRebate?[R('GST rebate','-'+$(+S.gstRebate))]:[])]});
    const it=S.closing.filter(x=>+x.a).map(x=>R(x.n,$(+x.a)));if(it.length)sp.sections.push({h:'Other costs',rows:it});
    sp.sections.push({h:'Total',rows:[R('Closing costs',O.clTot),R('Down payment',$(d.down)),R('Cash needed to close',O.cash)]});
    sp.notes=['Property transfer tax and GST figures are estimates only and are not tax or legal advice. Please confirm with your lawyer or notary.',gen]}
  else if(t==='refi'){sp.title='Refinance Options';
    sp.hero=[['Net savings this term (break and save)',O.bsNet,'After the penalty and fees'],['Cash out (equity takeout)',O.eqCash,'After paying off the current mortgage'+(+S.rDebts?' and debts':'')]];
    sp.sections=[{h:'Your current mortgage',rows:[R('Home value',$(+v('rValue'))),R('Mortgage balance',$(+v('rBal'))),R('Current rate',pc(v('rCurRate'))),R('Months left in term',String(v('rMonths'))),R('Current monthly payment',$c(+v('rCurPmt')))]},
      {h:'Option 1: break early for a lower rate',rows:[R('Estimated penalty',O.pen),R('New rate',pc(v('rRate'))),R('Interest saved over the rest of the term',O.bsSave),...(+S.rFees?[R('Legal / appraisal / fees',$(+S.rFees))]:[]),R('Net savings',O.bsNet),R('Monthly payment change',O.bsPmt),R('Break-even',O.bsBE)]},
      {h:'Option 2: take out equity',rows:[R('Max mortgage ('+O.ltvL+' of value)',O.eqMax),R('New mortgage',$(+v('rNew'))),R('Pays off current mortgage',$(+v('rBal'))),...(+S.rDebts?[R('Pays off other debts',$(+S.rDebts))]:[]),...(S.rRoll?[R('Penalty added to mortgage',O.pen)]:[]),R('Cash out',O.eqCash),R('New monthly payment ('+pc(v('rRate'))+', '+v('rAmort')+' yrs)',O.eqPmt),R('Current payment plus debt payments',O.eqOld),R('Monthly change',O.eqChg)]}];
    sp.notes=['The penalty is an estimate. Your current lender will confirm the exact amount.',gen]}
  else if(t==='inc'){const qi=ratios(+v('reqLoan'),S.rate,S.amort);sp.title='Income Needed';
    sp.hero=[['Gross yearly income needed',O.need,O.needM+' per month']];
    sp.sections=[{h:'The mortgage',rows:[R('Mortgage amount',$(+v('reqLoan'))),R('Interest rate',rate),R('Amortization',am),R('Qualifying rate',O.qRate),R('Qualifying payment (monthly)',O.iqPmt)]},
      {h:'Monthly costs counted',rows:[R('Property tax',$c(qi.tax)),R('Heat',$c(qi.heat)),R('Strata ('+SET.strataPct+'% counted)',$c(qi.str)),R('Other debt payments',$c(qi.debts)),...(qi.rent>0?[R('Rental income',$c(qi.rent))]:[])]},
      {h:'Lender limits used',rows:[R('GDS: housing costs vs income',pc(qi.gl,1)),R('TDS: housing costs plus debts vs income',pc(qi.tl,1)),R('Limited by',qi.bind)]}];
    sp.notes=['Lender rules can vary.',gen]}
  else{sp.title='Mortgage Comparison';const f=k=>FREQ[v(k)].l;
    sp.hero=[['Payment difference (B vs A)',O.dP,'Per payment'],['Interest difference over the term',O.dI,'B vs A']];
    sp.sections=[{h:'Side by side',cols:['Mortgage A','Mortgage B'],rows:[['Mortgage',$(+v('cA_loan')),$(+v('cB_loan'))],['Rate',pc(v('cA_rate')),pc(v('cB_rate'))],['Amortization',v('cA_amort')+' yrs',v('cB_amort')+' yrs'],['Term',v('cA_term')+' yrs',v('cB_term')+' yrs'],['Frequency',f('cA_freq'),f('cB_freq')],['Payment',O.cAP,O.cBP],['Interest over term',O.cAI,O.cBI],['Principal paid over term',O.cAPr,O.cBPr],['Balance at end of term',O.cAB,O.cBB],['Total interest (full amortization)',O.cAT,O.cBT]]},
      {h:'Difference (B vs A)',rows:[R('Payment',O.dP),R('Interest over term',O.dI),R('Principal paid over term',O.dPr),R('Balance at end of term',O.dB)]}]}
  return sp}

function renderPdf(sp){
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:'pt',format:'letter'});
  const W=612,M=42,NAVY=[61,90,128],ORG=[242,140,40],INK=[30,30,30],GR=[105,105,105],LT=[244,244,240],LN=[222,222,216],BOT=700;
  let y=0;
  const head=()=>{d.setFillColor(...NAVY);d.rect(0,0,W,62,'F');d.setFillColor(...ORG);d.rect(0,62,W,3,'F');
    d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(19);d.text('Mack Mortgages',M,39);
    d.setFont('helvetica','normal');d.setFontSize(12);d.text(sp.title,W-M,39,{align:'right'});y=90};
  const foot=()=>{d.setDrawColor(...LN);d.line(M,722,W-M,722);d.setTextColor(...INK);d.setFont('helvetica','bold');d.setFontSize(9.5);
    d.text('Mack Chaisson   |   778-874-2451   |   Mack.Chaisson@Cleartrust.ca   |   mackmortgages.ca',W/2,738,{align:'center'});
    d.setFont('helvetica','normal');d.setTextColor(...GR);d.setFontSize(8);
    d.text('Mackenzie Chaisson, Mortgage Broker   |   Dominion Lending Centres Clear Trust Mortgages',W/2,751,{align:'center'});
    d.text('Page '+d.getNumberOfPages(),W-M,766,{align:'right'})};
  const need=h=>{if(y+h>BOT){foot();d.addPage();head()}};
  head();
  const dt=new Date().toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'});
  d.setFont('helvetica','normal');d.setFontSize(10.5);d.setTextColor(...GR);d.text((S.name?'Prepared for '+S.name+'      ':'')+dt,M,y);y+=18;
  const hs=sp.hero,gap=12,hw=(W-2*M-gap*(hs.length-1))/hs.length;
  hs.forEach((h,i)=>{const x=M+i*(hw+gap);d.setFillColor(...LT);d.roundedRect(x,y,hw,74,6,6,'F');d.setFillColor(...ORG);d.rect(x,y+10,3,54,'F');
    d.setTextColor(...GR);d.setFontSize(9.5);d.text(d.splitTextToSize(h[0],hw-28)[0],x+16,y+20);
    d.setTextColor(...NAVY);d.setFont('helvetica','bold');d.setFontSize(hs.length>1?20:26);d.text(h[1],x+16,y+48);
    d.setFont('helvetica','normal');if(h[2]){d.setTextColor(...GR);d.setFontSize(9);d.text(d.splitTextToSize(h[2],hw-28)[0],x+16,y+64)}});
  y+=96;
  const hdr=t=>{need(48);d.setTextColor(...NAVY);d.setFont('helvetica','bold');d.setFontSize(12.5);d.text(t,M,y);d.setDrawColor(...ORG);d.setLineWidth(1.2);d.line(M,y+5,M+28,y+5);d.setLineWidth(0.5);y+=22};
  for(const s of sp.sections){hdr(s.h);
    if(s.text){d.setFont('helvetica','normal');d.setFontSize(10.5);d.setTextColor(...INK);const ln=d.splitTextToSize(s.text,W-2*M);need(ln.length*14);d.text(ln,M,y);y+=ln.length*14+12;continue}
    if(s.cols){d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(...GR);d.text(s.cols[0],W-M-150,y,{align:'right'});d.text(s.cols[1],W-M,y,{align:'right'});y+=16}
    s.rows.forEach((r,i)=>{need(20);const last=i===s.rows.length-1;
      d.setFont('helvetica','normal');d.setFontSize(10.5);d.setTextColor(...INK);d.text(d.splitTextToSize(r[0],s.cols?W-2*M-310:W-2*M-170)[0],M,y);
      d.setFont('helvetica','bold');if(s.cols){d.text(r[1],W-M-150,y,{align:'right'});d.text(r[2],W-M,y,{align:'right'})}else d.text(r[1],W-M,y,{align:'right'});
      if(!last){d.setDrawColor(...LN);d.line(M,y+6,W-M,y+6)}y+=20});
    y+=12}
  if(sp.table){const tb=sp.table,cx=[M,M+150,M+300,W-M];
    const th=()=>{d.setFont('helvetica','bold');d.setFontSize(9.5);d.setTextColor(...GR);tb.head.forEach((h,i)=>d.text(h,i?cx[i]+(i<3?100:0):cx[0],y,i?{align:'right'}:{}));y+=6;d.setDrawColor(...NAVY);d.line(M,y,W-M,y);y+=13};
    hdr(tb.h);th();
    tb.rows.forEach((r,i)=>{if(y+15>BOT){foot();d.addPage();head();th()}
      if(i%2===0){d.setFillColor(...LT);d.rect(M,y-10,W-2*M,15,'F')}
      d.setFont('helvetica','normal');d.setFontSize(9.5);d.setTextColor(...INK);r.forEach((c,j)=>d.text(c,j?cx[j]+(j<3?100:0):cx[0]+4,y,j?{align:'right'}:{}));y+=15});
    y+=14}
  d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(...GR);
  for(const n of sp.notes){const ln=d.splitTextToSize(n,W-2*M);need(ln.length*11+4);d.text(ln,M,y);y+=ln.length*11+5}
  foot();return d}

build();renderItems();refresh();
const flush=()=>LS.set('mmc.cur',S);window.addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
